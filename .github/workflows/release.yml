name: Release module

# Push a tag like v1.2.0 and this workflow stamps the version and URLs into
# module.json, builds module.zip, and creates the GitHub release with both attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version, manifest and download URLs
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "${TAG#v}" \
             --arg u "$BASE" \
             --arg m "$BASE/releases/latest/download/module.json" \
             --arg d "$BASE/releases/download/$TAG/module.zip" \
             '.version=$v | .url=$u | .manifest=$m | .download=$d' module.json > module.tmp
          mv module.tmp module.json
          cat module.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build compendium packs
        run: |
          npm install --no-audit --no-fund
          node tools/build-packs.mjs

      - name: Build module.zip
        run: zip -r module.zip module.json README.md scripts styles icons packs/surge-tables

      - name: Create release and attach files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            module.json
            module.zip
